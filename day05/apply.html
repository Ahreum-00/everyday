<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>수강 신청서</title>
</head>
<body>
  <h1>수강 신청서</h1>
  <p>※ 연습용 폼입니다. 가짜 값만 넣으세요.</p>
  <hr>
  <!--
    [힌트] 막혔을 때 보는 뼈대입니다. 번호 순서대로 한 칸씩 쓰고, 한 칸 쓸 때마다 저장해서 화면을 확인하세요.
    모든 칸의 공통 규칙
      - label의 for  =  입력칸의 id   (글자를 누르면 칸이 골라지면 성공)
      - 서버로 가는 이름은 name. name이 없으면 그 칸은 안 보내진다
      - 칸 하나는 <p> … </p>로 감싸면 한 줄씩 떨어져 보인다
  -->

  <!-- ① form 시작 태그: action="https://httpbin.org/get"  method="get"
       (나중에 POST로 바꿀 때는 이 줄의 get 두 군데만 post로) -->
     <form action="https://httpbin.org/post" method="post">
    <!-- ② 이름: <p> 안에 label("이름") + input type="text", id="name", name="name", required
         예시로 이 칸만 완성해 둡니다 ↓ -->
    <p>
      <label for="name">이름</label>
      <input type="text" id="name" name="name" required>
    </p>

    <!-- ③ 이메일: label("이메일") + input type="email", id="email", name="email", required
         → @ 없이 보내면 브라우저가 막는다 -->
    <p>
     <label for="email">이메일</label>
     <input type="email" id="email" name="email" required>
    </p>

    <!-- ④ 비밀번호: label("비밀번호") + input type="password", id="pw", name="pw"
         → 화면에서만 ●로 가려진다. 암호화가 아니다 -->
   <p>      
    <label for="password">비밀번호</label>
    <input type="password" id="password" name="pw" required>
  </p>
    <!-- ⑤ 학년 (라디오, 여럿 중 하나)
         <fieldset> 안에 <legend>학년</legend>
         input type="radio" 4개 + 각각 label(1학년~4학년)
           - name은 4개 모두 똑같이 grade   ← 다르면 여러 개가 동시에 선택된다
           - value는 각각 1, 2, 3, 4        ← 없으면 값이 on으로 간다
           - id는 g1, g2, g3, g4 (label for와 짝) -->
     <fieldset>
          <legend>학년</legend>

          <input type="radio" id="g1" name="grade" value="1"> 
          <label for="g1">1학년</label>          
          <input type="radio" id="g2" name="grade" value="2"> 
          <label for="g2">2학년</label>    
          <input type="radio" id="g3" name="grade" value="3"> 
          <label for="g3">3학년</label>          
          <input type="radio" id="g4" name="grade" value="4"> 
          <label for="g4">4학년</label>           
     </fieldset>

    <!-- ⑥ 관심 분야 (체크박스, 여러 개)
         <fieldset> 안에 <legend>관심 분야</legend>
         input type="checkbox" 3개 + 각각 label
           - name은 모두 interest
           - value: frontend / backend / db
           - id: fe / be / db -->
     <fieldset>
          <legend>관심분야</legend>
          <input type="checkbox" id="fe" name="interest" value="fe">
          <label for="fe">프론트엔드</label>
          <input type="checkbox" id="be" name="interest" value="be">
          <label for="be">백엔드</label>
          <input type="checkbox" id="db" name="interest" value="db">
          <label for="db">DB</label>
     </fieldset>

    <!-- ⑦ 신청 과목 (펼침 목록)
         label("신청 과목", for="course") + <select id="course" name="course">
         option 4개: value는 과목코드, 화면 글자는 과목명
           CS101 웹 프로그래밍 기초 / CS102 자바 입문 / DB201 데이터베이스 / CS103 알고리즘 기초
         → 서버로 가는 값은 화면 글자가 아니라 value -->
<p>
     <label for="course">신청 과목</label>
     <select id="course" name="course">
          <option value="CS101">웹 프로그래밍 기초</option>
          <option value="CS102">JAVA</option>
          <option value="DB201">DB</option>
          <option value="CS103">알고리즘</option>
     </select>
</p>


    <!-- ⑧ 희망 시작일: label + input type="date", id="start", name="start" -->
<p>
     <label for="start">희망 시작일</label>
     <input type="date" id="start" name="start">
</p>
    <!-- ⑨ 하고 싶은 말: label + textarea id="memo" name="memo" rows="4"
         → <textarea></textarea> 끝 태그 필요. 사이에 공백·줄바꿈을 넣지 않는다(그것도 값이 된다) -->
<p>
     <label for="memo">하고 싶은 말</label><br>
     <textarea id="memo" name="memo" rows="8" cols="80"></textarea>
</p>
    <!-- ⑩ 버튼 두 개: type="submit" "신청" / type="reset" "다시 쓰기"
         → button은 type을 안 쓰면 submit(제출)이 된다. 제출 버튼은 생략해도 되지만,
           다시 쓰기처럼 다른 용도의 버튼은 type을 꼭 적는다 -->
<p>
     <button type="submit">신청</button>
     <button type="reset">다시 작성</button>     
</p>
</form>
  <!-- ⑪ form 끝 태그 -->

</body>
</html>
