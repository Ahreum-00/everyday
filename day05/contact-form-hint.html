<!--
  [힌트] my-site의 about.html에 넣을 "연락하기" 부분의 뼈대입니다.
  이 파일을 그대로 열지 말고, 4일차에 about.html에 만든 <section id="contact"> 안에 옮겨 적으며 채우세요.
  안내 문장 <p>내일 이 자리에 연락 폼이 들어간다.</p> 는 지우고, 그 자리에 ①~⑧을 씁니다.

  about.html 안에서의 위치
    <main>
      … 자기소개 section …
      <section id="contact">   ← 4일차에 만든 자리
        <h2>연락하기</h2>
        여기에 form
      </section>
    </main>
-->

<section id="contact">

           - id: label의 for와 짝만 맞으면 되는 페이지 안 이름 (c-name)
           - name: 서버와 약속한 이름 (name)
           → 하는 일이 달라서 값이 달라도 된다. 둘이 꼭 같아야 하는 게 아니다
         ※ 확인: label 글자를 누르면 칸이 골라진다(id 연결 OK) / 보낸 결과 "form"에 name이 보인다(name OK) -->


    <!-- ③ 이메일: label + input type="email", id="c-email", name="email", required -->


    <!-- ④ 문의 종류: label + select id="c-type" name="type"
         option 3개: project 프로젝트 제안 / question 질문 / etc 기타 -->


    <!-- ⑤ 내용: label + textarea id="c-msg" name="message" rows="5" required -->


    <!-- ⑥ 보내기 버튼: <p> 안에 button type="submit" -->

       <p>※ 연습용 폼입니다. 입력한 내용은 연습 서버(httpbin.org)로만 전송됩니다.</p> -->
