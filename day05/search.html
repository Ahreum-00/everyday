<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>검색 폼 연습</title>
</head>
<body>
  <h1>검색 폼 연습</h1>

  <form
       action="https://www.google.com/search"
       method="get">
    <label for="keyword">검색어</label>
    <input type="text" id="keyword" name="q" required>
    <button type="submit">구글에서 검색</button>
  </form>
  <form
      action="https://ko.wikipedia.org/wiki"
      method="get">
    <label for="keyword">위키백과</label>
    <input type="text" id="keyword" name="search" required>
    <button type="submit">위키백과에서 검색</button>


    </label>
    </form>
  <!--
    [힌트] 이 파일은 막혔을 때 보는 뼈대입니다. 주석 자리에 직접 코드를 써 넣으세요.

    ① form 시작 태그
       - 보낼 곳(action): 구글 검색 주소  https://www.google.com/search
       - 보내는 방법(method): get
  -->


    <!--
      ② label: 화면에 "검색어"라고 보이는 글자
         - for 값은 ③ input의 id와 똑같이 (예: keyword)
    -->


    <!--
      ③ input: 한 줄 글 입력칸 (type="text")
         - id: ②의 for와 같은 값
         - name: 구글이 기다리는 이름은 q  ← 이게 틀리면 구글이 검색어를 못 알아듣는다
         - 빈칸이면 못 보내게: required
    -->


    <!--
      ④ button: 글자 "구글에서 검색", type="submit"
    -->


  <!-- ⑤ form 끝 태그 -->


  <!--
    [도전] 위키백과용 폼을 하나 더
      action: https://ko.wikipedia.org/w/index.php
      입력칸의 name: search
      (id는 위 폼과 겹치지 않게 다른 값으로)
  -->
</body>
</html>
